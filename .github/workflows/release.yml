name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to repair and publish (for example v0.3.0)
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  wait-for-required-checks:
    # The aggregate `quality` check already ran every test layer against this
    # exact merge commit, so the release path verifies that evidence instead of
    # re-running the same suites and doubling the time to publish.
    name: Wait for required merge gates
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Require successful quality and security checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REQUIRED_CHECKS=(
            "quality"
            "dependency-security"
            "secret-scan"
            "analyze"
          )
          DEADLINE="$((SECONDS + 1800))"

          while true; do
            CHECK_RUNS="$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
              --jq '.check_runs')"
            PENDING=()
            FAILED=()

            for CHECK_NAME in "${REQUIRED_CHECKS[@]}"; do
              CHECK_RESULT="$(jq -r --arg name "$CHECK_NAME" \
                '[.[] | select(.name == $name)] | sort_by(.started_at) | last |
                  if . == null then "missing" else "\(.status):\(.conclusion // "pending")" end' \
                <<< "$CHECK_RUNS")"
              case "$CHECK_RESULT" in
                completed:success)
                  ;;
                completed:*)
                  FAILED+=("$CHECK_NAME ($CHECK_RESULT)")
                  ;;
                *)
                  PENDING+=("$CHECK_NAME ($CHECK_RESULT)")
                  ;;
              esac
            done

            if [ "${#FAILED[@]}" -gt 0 ]; then
              printf '::error::Required checks failed on %s: %s\n' \
                "$GITHUB_SHA" "$(IFS='; '; echo "${FAILED[*]}")"
              exit 1
            fi
            if [ "${#PENDING[@]}" -eq 0 ]; then
              {
                echo "## Required merge gates"
                echo
                echo "All required push checks succeeded on \`$GITHUB_SHA\`."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              printf '::error::Timed out waiting for required checks on %s: %s\n' \
                "$GITHUB_SHA" "$(IFS='; '; echo "${PENDING[*]}")"
              exit 1
            fi

            printf 'Waiting for required checks: %s\n' "$(IFS='; '; echo "${PENDING[*]}")"
            sleep 30
          done

  release:
    name: Create release preparation
    if: github.event_name == 'push'
    needs: [wait-for-required-checks]
    runs-on: ubuntu-latest
    # Only release preparation needs a lock, and only this job may be
    # superseded. Release Please keeps a single open release pull request that
    # covers every commit since the last release, so a newer run always
    # subsumes an older pending one. Locking the whole workflow instead would
    # put publication behind the same lock, where GitHub cancels the pending
    # run when a newer one arrives and strands a tagged release unpublished.
    concurrency:
      group: release-please
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
    steps:
      - name: Require release automation token
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          test -n "$RELEASE_PLEASE_TOKEN" || {
            echo "::error::Missing RELEASE_PLEASE_TOKEN. Configure a release-bot token before enabling automated releases."
            exit 1
          }
      - id: release-please
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  resolve-publication:
    name: Resolve publication
    needs: release
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.resolve.outputs.publish }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Resolve release tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CREATED: ${{ needs.release.outputs.release_created }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RECOVERY_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            RELEASE_TAG="$RECOVERY_TAG"
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "::error::Recovery tag must use the vX.Y.Z format."
              exit 1
            }
          else
            PACKAGE_VERSION="$(node -p "require('./package.json').version")"
            RELEASE_TAG="v$PACKAGE_VERSION"
          fi
          echo "tag_name=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName > /dev/null || {
              echo "::error::Recovery tag $RELEASE_TAG must have an existing GitHub Release."
              exit 1
            }
          elif [ "$RELEASE_CREATED" = "true" ]; then
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName > /dev/null || {
              echo "::error::Release Please did not create the expected GitHub Release $RELEASE_TAG."
              exit 1
            }
          elif [ "$RUN_ATTEMPT" -gt 1 ] && gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName > /dev/null; then
            echo "Resuming publication for existing release $RELEASE_TAG."
          else
            echo "No new release was created for this merge."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --force --tags
          TAG_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            test "$TAG_COMMIT" = "$GITHUB_SHA" || {
              echo "::error::Release tag $RELEASE_TAG points to $TAG_COMMIT, not this merge commit $GITHUB_SHA."
              exit 1
            }
          fi
          git checkout --detach "$TAG_COMMIT"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION" || {
            echo "::error::Release tag $RELEASE_TAG does not match package version $PACKAGE_VERSION."
            exit 1
          }
          TAG_TYPE="$(git cat-file -t "refs/tags/$RELEASE_TAG")"
          if [ "$TAG_TYPE" = "commit" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -d "$RELEASE_TAG"
            git tag --annotate "$RELEASE_TAG" "$TAG_COMMIT" --message "Release $RELEASE_TAG"
            git push --force origin "refs/tags/$RELEASE_TAG"
            git fetch --force --tags
            TAG_TYPE="$(git cat-file -t "refs/tags/$RELEASE_TAG")"
          fi
          test "$TAG_TYPE" = "tag" || {
            echo "::error::Release tag $RELEASE_TAG is not annotated."
            exit 1
          }
          echo "publish=true" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish release
    needs: resolve-publication
    if: always() && needs.resolve-publication.outputs.publish == 'true'
    uses: ./.github/workflows/publish.yml
    # A called workflow starts with an empty `secrets` context, so the
    # marketplace environment credential resolves to an empty string without
    # this. The environment gate still pauses for approval either way, which
    # makes the omission look like a credential problem rather than a wiring one.
    secrets: inherit
    with:
      tag: ${{ needs.resolve-publication.outputs.tag_name }}

  report-failure:
    name: Report release failure
    # Release automation runs unattended after a merge, so a failure that is
    # only visible in the Actions tab goes unnoticed. Versions v0.3.1 through
    # v0.5.0 were each tagged and then silently never published.
    needs: [wait-for-required-checks, release, resolve-publication, publish]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          WAIT_RESULT: ${{ needs.wait-for-required-checks.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          RESOLVE_RESULT: ${{ needs.resolve-publication.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        with:
          script: |
            const title = '[Automation] Release automation failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Release automation failed on \`${context.sha}\`.`,
              '',
              '| Stage | Result |',
              '| --- | --- |',
              `| Wait for required merge gates | ${process.env.WAIT_RESULT} |`,
              `| Create release preparation | ${process.env.RELEASE_RESULT} |`,
              `| Resolve publication | ${process.env.RESOLVE_RESULT} |`,
              `| Publish release | ${process.env.PUBLISH_RESULT} |`,
              '',
              'A tagged release that does not publish leaves the Marketplace behind this repository.',
              'After fixing the cause, publish the existing tag with the `Publish to Visual Studio',
              'Marketplace` workflow rather than cutting a new version.',
              '',
              `Run: ${runUrl}`,
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(issue => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
