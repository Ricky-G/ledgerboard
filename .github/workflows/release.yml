name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to repair and publish (for example v0.3.0)
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  identify-release-merge:
    name: Identify release pull request merge
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release_merge: ${{ steps.identify.outputs.release_merge }}
    steps:
      - name: Verify release pull request identity
        id: identify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSOCIATED_PULLS="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls")"
          RELEASE_PULLS="$(jq -c --arg repository "$GITHUB_REPOSITORY" '
            [.[] | select(
              .merged_at != null
              and .base.ref == "main"
              and .head.repo.full_name == $repository
              and .head.ref == "release-please--branches--main--components--ledgerboard"
              and (([.labels[]?.name] | index("autorelease: pending")) != null)
              and (.title | test("^chore\\(main\\): release [0-9]+\\.[0-9]+\\.[0-9]+$"))
            )]
          ' <<< "$ASSOCIATED_PULLS")"
          RELEASE_COUNT="$(jq 'length' <<< "$RELEASE_PULLS")"
          if [ "$RELEASE_COUNT" -gt 1 ]; then
            echo "::error::Merge commit $GITHUB_SHA is associated with multiple release pull requests."
            exit 1
          fi
          if [ "$RELEASE_COUNT" -eq 1 ]; then
            RELEASE_NUMBER="$(jq -r '.[0].number' <<< "$RELEASE_PULLS")"
            echo "Verified release pull request #$RELEASE_NUMBER."
            echo "release_merge=true" >> "$GITHUB_OUTPUT"
          else
            echo "This is not a release pull request merge. Release preparation remains manual."
            echo "release_merge=false" >> "$GITHUB_OUTPUT"
          fi

  wait-for-required-checks:
    # The aggregate `quality` check already ran every test layer against this
    # exact merge commit, so the release path verifies that evidence instead of
    # re-running the same suites and doubling the time to publish.
    name: Wait for required merge gates
    needs: identify-release-merge
    if: github.event_name == 'push' && needs.identify-release-merge.outputs.release_merge == 'true'
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Require successful quality and security checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REQUIRED_CHECKS=(
            "quality"
            "dependency-security"
            "secret-scan"
            "analyze"
          )
          DEADLINE="$((SECONDS + 1800))"

          while true; do
            CHECK_RUNS="$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
              --jq '.check_runs')"
            PENDING=()
            FAILED=()

            for CHECK_NAME in "${REQUIRED_CHECKS[@]}"; do
              CHECK_RESULT="$(jq -r --arg name "$CHECK_NAME" \
                '[.[] | select(.name == $name)] | sort_by(.started_at) | last |
                  if . == null then "missing" else "\(.status):\(.conclusion // "pending")" end' \
                <<< "$CHECK_RUNS")"
              case "$CHECK_RESULT" in
                completed:success)
                  ;;
                completed:*)
                  FAILED+=("$CHECK_NAME ($CHECK_RESULT)")
                  ;;
                *)
                  PENDING+=("$CHECK_NAME ($CHECK_RESULT)")
                  ;;
              esac
            done

            if [ "${#FAILED[@]}" -gt 0 ]; then
              printf '::error::Required checks failed on %s: %s\n' \
                "$GITHUB_SHA" "$(IFS='; '; echo "${FAILED[*]}")"
              exit 1
            fi
            if [ "${#PENDING[@]}" -eq 0 ]; then
              {
                echo "## Required merge gates"
                echo
                echo "All required push checks succeeded on \`$GITHUB_SHA\`."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              printf '::error::Timed out waiting for required checks on %s: %s\n' \
                "$GITHUB_SHA" "$(IFS='; '; echo "${PENDING[*]}")"
              exit 1
            fi

            printf 'Waiting for required checks: %s\n' "$(IFS='; '; echo "${PENDING[*]}")"
            sleep 30
          done

  release:
    name: Create tagged release
    needs: [identify-release-merge, wait-for-required-checks]
    if: github.event_name == 'push' && needs.identify-release-merge.outputs.release_merge == 'true'
    runs-on: ubuntu-latest
    # Release Please mutations share a lock with manual preparation. Publication
    # stays outside it so another preparation cannot strand a tagged release.
    concurrency:
      group: release-please
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
    steps:
      - name: Require release automation token
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          test -n "$RELEASE_PLEASE_TOKEN" || {
            echo "::error::Missing RELEASE_PLEASE_TOKEN. Configure a release-bot token before enabling automated releases."
            exit 1
          }
      - id: release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  resolve-publication:
    name: Resolve publication
    needs: release
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.resolve.outputs.publish }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Resolve release tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CREATED: ${{ needs.release.outputs.release_created }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RECOVERY_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            RELEASE_TAG="$RECOVERY_TAG"
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "::error::Recovery tag must use the vX.Y.Z format."
              exit 1
            }
          else
            PACKAGE_VERSION="$(node -p "require('./package.json').version")"
            RELEASE_TAG="v$PACKAGE_VERSION"
          fi
          echo "tag_name=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName > /dev/null || {
              echo "::error::Recovery tag $RELEASE_TAG must have an existing GitHub Release."
              exit 1
            }
          elif [ "$RELEASE_CREATED" = "true" ]; then
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName > /dev/null || {
              echo "::error::Release Please did not create the expected GitHub Release $RELEASE_TAG."
              exit 1
            }
          elif [ "$RUN_ATTEMPT" -gt 1 ] && gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName > /dev/null; then
            echo "Resuming publication for existing release $RELEASE_TAG."
          else
            echo "No new release was created for this merge."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --force --tags
          TAG_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            test "$TAG_COMMIT" = "$GITHUB_SHA" || {
              echo "::error::Release tag $RELEASE_TAG points to $TAG_COMMIT, not this merge commit $GITHUB_SHA."
              exit 1
            }
          fi
          git checkout --detach "$TAG_COMMIT"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION" || {
            echo "::error::Release tag $RELEASE_TAG does not match package version $PACKAGE_VERSION."
            exit 1
          }
          TAG_TYPE="$(git cat-file -t "refs/tags/$RELEASE_TAG")"
          if [ "$TAG_TYPE" = "commit" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -d "$RELEASE_TAG"
            git tag --annotate "$RELEASE_TAG" "$TAG_COMMIT" --message "Release $RELEASE_TAG"
            git push --force origin "refs/tags/$RELEASE_TAG"
            git fetch --force --tags
            TAG_TYPE="$(git cat-file -t "refs/tags/$RELEASE_TAG")"
          fi
          test "$TAG_TYPE" = "tag" || {
            echo "::error::Release tag $RELEASE_TAG is not annotated."
            exit 1
          }
          echo "publish=true" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish release
    needs: resolve-publication
    if: always() && needs.resolve-publication.outputs.publish == 'true'
    uses: ./.github/workflows/publish.yml
    # A called workflow starts with an empty `secrets` context, so the
    # marketplace environment credential resolves to an empty string without
    # this. The environment gate still pauses for approval either way, which
    # makes the omission look like a credential problem rather than a wiring one.
    secrets: inherit
    with:
      tag: ${{ needs.resolve-publication.outputs.tag_name }}

  report-failure:
    name: Report release failure
    # Main validation and release publication fail for different reasons and
    # require different recovery paths. Report both without making a maintainer
    # reconstruct the failing layer from several workflow runs.
    needs: [identify-release-merge, wait-for-required-checks, release, resolve-publication, publish]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          IDENTIFY_RESULT: ${{ needs.identify-release-merge.result }}
          WAIT_RESULT: ${{ needs.wait-for-required-checks.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          RESOLVE_RESULT: ${{ needs.resolve-publication.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        with:
          script: |
            const validationFailed = process.env.WAIT_RESULT === 'failure';
            const title = validationFailed
              ? '[Automation] Main validation failed'
              : '[Automation] Release automation failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let body;
            if (validationFailed) {
              const releaseCheckNames = new Set([
                'Identify release pull request merge',
                'Wait for required merge gates',
                'Create tagged release',
                'Resolve publication',
                'Publish release',
                'Report release failure',
              ]);
              const { data: commitChecks } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha,
                filter: 'latest',
                per_page: 100,
              });
              const failedChecks = commitChecks.check_runs
                .filter(check => check.status === 'completed'
                  && check.conclusion !== 'success'
                  && !releaseCheckNames.has(check.name))
                .sort((left, right) => left.name.localeCompare(right.name));
              const failedRows = failedChecks.length > 0
                ? failedChecks.map(check =>
                  `| [${check.name}](${check.details_url}) | ${check.conclusion || 'unknown'} |`)
                : ['| No failed check run was returned | unknown |'];

              const { data: associatedPulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
              });
              const associatedPull = associatedPulls.find(pull => pull.merged_at) || associatedPulls[0];
              let pullSummary = 'No associated pull request was returned for this commit.';
              let pullQualitySummary = '';
              if (associatedPull) {
                const { data: pull } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: associatedPull.number,
                });
                const merger = pull.merged_by?.login ? `@${pull.merged_by.login}` : 'an unknown actor';
                pullSummary = `Pull request [#${pull.number}](${pull.html_url}) was merged by ${merger}.`;

                const { data: pullChecks } = await github.rest.checks.listForRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: pull.head.sha,
                  filter: 'latest',
                  per_page: 100,
                });
                const quality = pullChecks.check_runs
                  .filter(check => check.name === 'quality')
                  .sort((left, right) => left.started_at.localeCompare(right.started_at))
                  .at(-1);
                if (quality) {
                  pullQualitySummary = `Its \`CI / quality\` check concluded \`${quality.conclusion || quality.status}\`.`;
                }
              }

              body = [
                `Main validation failed on \`${context.sha}\`.`,
                '',
                pullSummary,
                ...(pullQualitySummary ? [pullQualitySummary] : []),
                '',
                '| Failed check | Conclusion |',
                '| --- | --- |',
                ...failedRows,
                '',
                'Tagged release creation did not start, so there is no release tag to publish.',
                '',
                '### Recovery record',
                '',
                '- [ ] Document why the emergency bypass or post-merge failure occurred.',
                '- [ ] Link the corrective pull request.',
                '- [ ] Confirm every required check passes on the corrective merge.',
                '',
                `Run: ${runUrl}`,
              ].join('\n');
            } else {
              body = [
                `Release automation failed on \`${context.sha}\`.`,
                '',
                '| Stage | Result |',
                '| --- | --- |',
                `| Identify release pull request merge | ${process.env.IDENTIFY_RESULT} |`,
                `| Wait for required merge gates | ${process.env.WAIT_RESULT} |`,
                `| Create tagged release | ${process.env.RELEASE_RESULT} |`,
                `| Resolve publication | ${process.env.RESOLVE_RESULT} |`,
                `| Publish release | ${process.env.PUBLISH_RESULT} |`,
                '',
                'After fixing the cause, check whether the expected release tag exists.',
                'If it exists, publish the existing tag with the `Publish to Visual Studio Marketplace`',
                'workflow rather than cutting a new version. If no tag exists, rerun this workflow.',
                '',
                `Run: ${runUrl}`,
              ].join('\n');
            }
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(issue => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
