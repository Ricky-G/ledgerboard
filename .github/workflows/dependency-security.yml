name: Dependency security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.event.pull_request.number || github.ref }}
  # A push to main is never cancelled: the release gate waits on its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-security:
    name: dependency-security
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validate the lockfile and install dependencies
        id: install
        run: npm ci --ignore-scripts
      - name: Audit resolved dependencies
        id: audit
        run: npm run audit:dependencies
      - name: Publish dependency security summary
        if: ${{ always() }}
        env:
          INSTALL: ${{ steps.install.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
        run: |
          {
            echo "## Dependency security"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Lockfile integrity | $INSTALL |"
            echo "| High and critical audit findings | $AUDIT |"
          } >> "$GITHUB_STEP_SUMMARY"
